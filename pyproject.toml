[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dmarc-analyzer"
version = "1.2.0"
description = "Local macOS GUI for parsing DMARC aggregate reports (RFC 7489) with SQLite persistence and live DNS lookups"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "dnspython>=2.0",
]

[project.optional-dependencies]
# Native drag-and-drop from Finder
dnd = ["tkinterdnd2>=0.4"]

[project.gui-scripts]
dmarc-analyzer = "dmarc_analyzer:main"

[tool.setuptools]
py-modules = ["dmarc_analyzer"]
